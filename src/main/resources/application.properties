spring.application.name=BookingApp

# Local development uses an in-memory database. Set these variables to use MySQL.
spring.datasource.url=${DB_URL:jdbc:h2:mem:bookingapp;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DB_SCHEMA_ACTION:update}
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
